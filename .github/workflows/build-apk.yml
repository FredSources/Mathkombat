# build-apk.yml — CI/CD MathKombat
# Build les APK debug + release sur un tag v* (git tag vX.Y.Z) et publie la
# Release GitHub avec les APK attachés.
#
# Chaîne : le jeu web (Vite) est construit puis embarqué dans l'APK WebView
# (scripts/build-apk.sh) — une seule source de contenu (game/dist/).
# gradle.properties : la surcharge aapt2/qemu est retirée sur ce runner — le
# runner x86_64 exécute aapt2 nativement (pas besoin de scripts/setup-sdk-qemu.sh).
#
# Signature release : créer les secrets GitHub
#   KEYSTORE_BASE64 (keystore JKS en base64), KEYSTORE_PASSWORD, KEY_ALIAS,
#   KEY_PASSWORD — sinon l'APK release est signée avec la clé debug (tests).
# (mêmes clés que le projet openwebui-android — reprise à la demande)

name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances du jeu web
        run: npm install
        working-directory: game

      - name: Keystore de release (si secrets présents)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore de release reconnu."
          else
            echo "Aucun keystore : release signée avec la clé debug (installable, tests)."
          fi

      - name: Build web RELEASE + APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-apk.sh

      - name: Build APK debug (même contenu web)
        run: |
          cd android
          ../tools/gradle/gradle-*/bin/gradle --no-daemon \
            -Pandroid.aapt2FromMavenOverride="$GITHUB_WORKSPACE/tools/android-sdk/build-tools/34.0.0/aapt2" \
            assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../output/MathKombat-debug.apk

      - name: Vérifications
        run: |
          test -f output/MathKombat.apk
          test -f output/MathKombat-debug.apk
          unzip -l output/MathKombat.apk | grep -q 'assets/index.html'
          ./tools/android-sdk/build-tools/34.0.0/aapt dump badging output/MathKombat.apk | grep "package:"

      - uses: actions/upload-artifact@v4
        with:
          name: mathkombat-apk-${{ github.sha }}
          path: |
            output/MathKombat.apk
            output/MathKombat-debug.apk
          if-no-files-found: error

      - name: Corps de release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "## MathKombat ${GITHUB_REF_NAME}"
            echo ""
            echo "Jeu de combat éducatif (calcul mental) — APK WebView, hors-ligne."
            echo ""
            echo "| APK | Contenu |"
            echo "|---|---|"
            echo "| \`MathKombat.apk\` | release signée (clés de signature du projet) |"
            echo "| \`MathKombat-debug.apk\` | debug (hooks de test, logs) |"
            echo ""
            echo "Installation : \`adb install -r MathKombat.apk\` (paysage, plein écran)."
          } > .tmp-release-body.md

      - name: Publication de la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .tmp-release-body.md
          files: |
            output/MathKombat.apk
            output/MathKombat-debug.apk
          generate_release_notes: true
