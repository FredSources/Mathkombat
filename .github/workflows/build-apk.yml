# build-apk.yml — CI/CD MathKombat
# Build les APK debug + release sur un tag v* (git tag vX.Y.Z) et publie la
# Release GitHub avec les APK attachés.
#
# Chaîne : le jeu web (Vite) est construit puis embarqué dans l'APK WebView
# (scripts/build-apk.sh) — une seule source de contenu (game/dist/).
# gradle.properties : la surcharge aapt2/qemu est retirée sur ce runner — le
# runner x86_64 exécute aapt2 nativement (pas besoin de scripts/setup-sdk-qemu.sh).
#
# Signature stable : 4 secrets GitHub OBLIGATOIRES (échec si absent) —
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
#   La même clé signe la release ET le debug ; l'empreinte est épinglée dans
#   la phase « Vérifications ». Aucun keystore n'est versionné.
# (mêmes clés que le projet openwebui-android — reprise à la demande)

name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Version du produit : le TAG fait foi (cohérence versionName/versionCode
      # de l'APK, log du jeu et nom des fichiers) — injectée en MK_VERSION pour
      # tout le build (scripts/env.sh la respecte si déjà définie).
      - name: Version du produit (tag → MK_VERSION)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="dev-${GITHUB_SHA::7}"
          fi
          echo "MK_VERSION=$V" >> "$GITHUB_ENV"
          echo "Version du build : $V"

      # tools/ (SDK Android, Gradle, JDK) n'est PAS versionné : le projet le
      # reconstitue avec scripts/setup-sdk.sh (isolation, AGENTS.md §4) — idem ici.
      - name: Outillage embarqué (SDK 34 + Gradle + JDK dans tools/)
        run: bash scripts/setup-sdk.sh
      - name: Dépendances du jeu web
        run: npm install
        working-directory: game

      # Signature stable — OBLIGATOIRE : un keystore régénéré à chaque run change
      # le certificat et Android refuse alors de mettre à jour l'APK installée.
      - name: Keystore de release (secrets obligatoires)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for nom in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!nom}" ]; then
              echo "ERREUR: secret $nom absent — signature stable impossible, build refusé." >&2
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore de release reconnu (stable)."

      - name: Build web RELEASE + APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-apk.sh

      - name: Build APK debug (même contenu web)
        # Même clé stable que la release : transmettre les secrets aussi ici,
        # sinon Gradle retombe sur les valeurs par défaut et ne peut pas ouvrir
        # le keystore (alias/password différents) → échec de signature debug.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ../tools/gradle/gradle-*/bin/gradle --no-daemon \
            -Pandroid.aapt2FromMavenOverride="$GITHUB_WORKSPACE/tools/android-sdk/build-tools/34.0.0/aapt2" \
            assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../output/MathKombat-debug.apk

      - name: Vérifications
        run: |
          test -f output/MathKombat.apk
          test -f output/MathKombat-debug.apk
          unzip -l output/MathKombat.apk | grep -q 'assets/index.html'
          ./tools/android-sdk/build-tools/34.0.0/aapt dump badging output/MathKombat.apk | grep "package:"
          # Cohérence version/tag (demande) : chaque APK porte la version du tag
          ./tools/android-sdk/build-tools/34.0.0/aapt dump badging output/MathKombat.apk \
            | grep -q "versionName='$MK_VERSION'"
          ./tools/android-sdk/build-tools/34.0.0/aapt dump badging output/MathKombat-debug.apk \
            | grep -q "versionName='$MK_VERSION'"
          echo "Cohérence version OK : versionName=$MK_VERSION (tag $GITHUB_REF_NAME)"
          # Signature stable : empreinte du certificat ÉPINGLÉE. Sans cela, un
          # keystore régénéré change de certificat et l'APK ne se met plus à jour.
          RELEASE_SHA256='7fa25845d80017c8cd81669e2955de6d21b2d7ac4a5a0d5f0fa981866dc34e4'
          ./tools/android-sdk/build-tools/34.0.0/apksigner verify --print-certs output/MathKombat.apk \
            | grep -qi "$RELEASE_SHA256"
          ./tools/android-sdk/build-tools/34.0.0/apksigner verify --print-certs output/MathKombat-debug.apk \
            | grep -qi "$RELEASE_SHA256"
          echo "Signature stable OK (release et debug) : $RELEASE_SHA256"

      # Nommage : mathkombat-<version>-release.apk / -debug.apk (demande)
      - name: Nommage des APK selon la version
        run: |
          VERSION="$MK_VERSION"
          cp output/MathKombat.apk "output/MathKombat-${VERSION}-release.apk"
          cp output/MathKombat-debug.apk "output/MathKombat-${VERSION}-debug.apk"
          rm output/MathKombat.apk output/MathKombat-debug.apk
          ls -la output/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mathkombat-apk-${{ github.sha }}
          path: output/MathKombat-*.apk
          if-no-files-found: error

      - name: Retire les anciens APK de la release (re-publication)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for a in "MathKombat.apk" "MathKombat-debug.apk" \
                   "MathKombat-${VERSION}-release.apk" "MathKombat-${VERSION}-debug.apk"; do
            gh release delete-asset "${GITHUB_REF_NAME}" "$a" --repo "${GITHUB_REPOSITORY}" -y 2>/dev/null || true
          done

      - name: Corps de release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## MathKombat ${GITHUB_REF_NAME}"
            echo ""
            echo "Jeu de combat éducatif (calcul mental) — APK WebView, hors-ligne."
            echo ""
            echo "| APK | Contenu |"
            echo "|---|---|"
            echo "| \`MathKombat-${VERSION}-release.apk\` | release signée (clés de signature du projet) |"
            echo "| \`MathKombat-${VERSION}-debug.apk\` | debug (hooks de test, logs) |"
            echo ""
            echo "Installation : \`adb install -r MathKombat-${VERSION}-release.apk\` (paysage, plein écran)."
          } > .tmp-release-body.md

      - name: Publication de la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .tmp-release-body.md
          files: output/MathKombat-*.apk
          generate_release_notes: true
