// app/build.gradle — application WebView MathKombat (J7).
//
// Contenu : le jeu web (game/dist/) est copié dans `src/main/assets/` par
// `scripts/build-apk.sh` — une seule source de vérité pour les assets.
// Zéro dépendance externe (Activity android native, pas d'AndroidX) : le build
// reste le plus possible hors-ligne (SDK et Gradle embarqués, AGENTS.md §4).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version du produit : la SOURCE DE VÉRITÉ est le tag git v* — MK_VERSION est
// injecté par scripts/env.sh (local) ou la CI (GITHUB_REF_NAME). versionCode est
// dérivé du semver (x*10000 + y*100 + z) : croissant avec la version, jamais figé.
def mkVersion = System.getenv('MK_VERSION') ?: '0.0.0-dev'
def mkMatcher = (mkVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
def mkVersionCode = mkMatcher.find()
    ? Integer.parseInt(mkMatcher.group(1)) * 10000 +
      Integer.parseInt(mkMatcher.group(2)) * 100 +
      Integer.parseInt(mkMatcher.group(3))
    : 1

android {
    namespace 'fr.mathkombat'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.mathkombat'
        minSdk 24
        targetSdk 34
        versionCode mkVersionCode
        versionName mkVersion
    }

    // Signature release : clés de l'environnement (CI — secrets GitHub) ou
    // keystore local. LA CLÉ DOIT ÊTRE STABLE : une clé différente à chaque
    // build empêche Android de mettre à jour une version déjà installée.
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: "$rootDir/../tools/mathkombat.keystore")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'mathkombat'
            keyAlias System.getenv('KEY_ALIAS') ?: 'mathkombat'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'mathkombat'
        }
    }

    buildTypes {
        debug {
            // Même clé stable que la release (secrets CI ou keystore local non
            // versionné) : aucun keystore dans le dépôt, certificat constant
            // d'une version à l'autre pour l'APK debug aussi.
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
